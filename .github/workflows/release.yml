# Builds the addon zip and uploads it to CurseForge when a tag is pushed.
# The tag name is the version; a tag containing "alpha" or "beta" is uploaded as such,
# anything else as a release. Needs the repository secret AUREOLECURSOR
# (GITHUB_TOKEN is provided by GitHub). The project ID comes from the TOC.
name: Package and release

on:
  push:
    tags:
      - '**'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.AUREOLECURSOR }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Clone project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Changelog of this version only
        # CurseForge shows CHANGELOG.md; cut it down to the section of the tag
        # (0.5.0-alpha2 -> "## 0.5.0 (alpha 2)", 0.5.0 -> "## 0.5.0").
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ "$tag" =~ ^(.+)-(alpha|beta)([0-9]+)$ ]]; then
            heading="## ${BASH_REMATCH[1]} (${BASH_REMATCH[2]} ${BASH_REMATCH[3]})"
          else
            heading="## ${tag}"
          fi
          # From the heading to the next "---" line or the next "## " heading, whichever comes first.
          # The checkout has CRLF line endings (.gitattributes eol=crlf), so cut the CR off every line first.
          awk -v h="$heading" '{sub(/\r$/, "")} $0 == h {on=1; print; next} on && (/^---/ || /^## /) {exit} on' CHANGELOG.md > CHANGELOG.cut
          if [ ! -s CHANGELOG.cut ]; then
            echo "::error::No section '$heading' in CHANGELOG.md"
            exit 1
          fi
          mv CHANGELOG.cut CHANGELOG.md
          cat CHANGELOG.md

      - name: Package and release
        uses: BigWigsMods/packager@v2
        with:
          # File name and CurseForge label: AureoleCursor_<tag> (e.g. AureoleCursor_0.5.0-alpha2, AureoleCursor_0.5.0).
          args: -n "{package-name}_{project-version}:{package-name}_{project-version}"
